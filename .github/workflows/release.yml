name: release

# A vX.Y.Z tag publishes the image and the chart at that version, in that
# order: the chart's default image tag is its appVersion, so the image has to
# exist before the chart that points at it. Process: docs/releasing.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nprodromou/obsidian-headless-sync
  CHART_REPO: oci://ghcr.io/nprodromou/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check versions agree with the tag
        id: v
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          chart=$(yq '.version' charts/obsidian-headless-sync/Chart.yaml)
          app=$(yq '.appVersion' charts/obsidian-headless-sync/Chart.yaml)
          pkg=$(node -p 'require("./image/app/package.json").version')
          echo "tag=$tag chart=$chart appVersion=$app app=$pkg"
          [ "$tag" = "$chart" ] && [ "$tag" = "$app" ] && [ "$tag" = "$pkg" ] \
            || { echo "::error::tag, Chart version, appVersion and image/app/package.json must match"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Package and push the chart
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/obsidian-headless-sync -d "$RUNNER_TEMP/dist"
          helm push "$RUNNER_TEMP/dist/obsidian-headless-sync-${{ steps.v.outputs.version }}.tgz" "$CHART_REPO"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
