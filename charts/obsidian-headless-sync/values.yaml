# Default values for obsidian-headless-sync.
# Full walkthrough: https://github.com/nprodromou/obsidian-headless-chart

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/nprodromou/obsidian-headless-sync
  # Defaults to the chart's appVersion.
  tag: ""
  # Pin by digest (sha256:...) to override the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

obsidian:
  # Install the official client (npm: obsidian-headless) at pod start, at the
  # version pinned in the image's lockfile. The published image does not ship
  # the client because it is not openly licensed. Set false only when running
  # an image you built yourself with --build-arg BUNDLE_OB=true.
  installClient: true
  auth:
    # A Secret holding the token `ob login` stores locally
    # (~/.obsidian-headless/auth_token on macOS, ~/.config/obsidian-headless/auth_token on Linux).
    #
    # Leave empty for wizard mode: no Secret, and you log in and link vaults
    # from the setup page instead (see `ui`). The token then lives on the data
    # volume. Set it for Secret mode, where the setup page is off and the pod
    # refuses to start until every vault links. The two are exclusive; to move
    # from wizard to Secret mode, set this and then delete
    # /data/config/obsidian-headless/auth_token (don't `ob logout` it).
    existingSecret: ""
    key: OBSIDIAN_AUTH_TOKEN
  # How this client appears in Obsidian Sync's version history.
  # Defaults to the release's full name.
  deviceName: ""

# One entry per Obsidian Sync remote vault. Each runs in its own container.
vaults: []
#  - name: notes              # local directory and container suffix (lowercase, digits, -)
#    remote: "My Notes"       # remote vault name or ID (`ob sync-list-remote`)
#    encryption:              # only for end-to-end encrypted vaults
#      existingSecret: obsidian-e2e
#      key: notes
#    sync:                    # all optional; omitted fields keep the client's defaults
#      mode: bidirectional    # bidirectional | pull-only | mirror-remote
#      conflictStrategy: merge
#      excludedFolders: []
#      fileTypes: [image, pdf]
#      configs: []            # [] disables syncing .obsidian settings
#    git:                     # optional: git is the source of truth, Sync carries it to devices
#      repository: https://github.com/you/notes.git
#      branch: ""             # default: the remote's default branch
#      # Changed tracked files matching these globs are restored from git before
#      # each fast-forward, so device edits to generated files cannot freeze the
#      # vault. ["**"] makes the vault read-only from every device.
#      discardLocalChanges: []

git:
  auth:
    # none | token (HTTPS) | ssh
    type: none
    existingSecret: ""
    username: x-access-token
    tokenKey: token
    sshKeyKey: ssh-privatekey
    # Leave empty to trust a host key on first use.
    knownHostsKey: known_hosts
  # How often the keeper fetches and fast-forwards git-backed vaults.
  intervalSeconds: 900
  # Status note written into each git-backed vault (synced to devices).
  # Empty disables it. Must not be tracked in the repo.
  statusFile: VAULT-STATUS.md
  lfs: true

# Time zone for the status note.
timezone: UTC

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}
  # Keep the claim when the release is uninstalled. It holds the vaults and the
  # client's sync state; losing it forces a full re-sync.
  keep: true

prepare:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi

sync:
  # A sync container is restarted after this long with no client output. An
  # idle client logs every 30 seconds.
  livenessStaleSeconds: 900
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 1Gi

keeper:
  port: 9090
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    # Covers a git pass plus one `ob` process from the setup wizard, which
    # peaks at about 100Mi (an E2E `ob sync-setup`, scrypt key derivation).
    limits:
      memory: 384Mi

# Status page served by the keeper: per-vault sync times, the last line each
# client logged, and for git-backed vaults the keeper state, changed and
# untracked file names, and the fix command. It shows note titles, so it is
# kept off the Service and bound to loopback. Open it with
#   kubectl port-forward deploy/<release> 8080:8080
# and browse http://localhost:8080.
#
# In wizard mode (no obsidian.auth.existingSecret) it also serves the setup
# wizard at /setup: log in to Obsidian and link the vaults declared below. The
# wizard needs the setup code the keeper prints to its log on every start.
ui:
  enabled: true
  port: 8080
  # 127.0.0.1 keeps the page reachable only through kubectl port-forward. Any
  # other address is the exposure opt-in: the chart then adds a `ui` port to the
  # Service and requires allowedHosts. It renders no Ingress or HTTPRoute, and
  # the status page has no authentication of its own (the setup wizard still
  # needs its setup code); put your own in front of it.
  listenAddress: 127.0.0.1
  # Host names the page answers to, besides localhost, 127.0.0.1 and [::1].
  # Requests with any other Host header get 421 (DNS rebinding defence).
  allowedHosts: []

metrics:
  service:
    enabled: true
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 60s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    severity: warning
    # A git-backed vault in any state other than OK for this long.
    gitNotOkFor: 1h
    # No "Fully synced" from a vault's client for this many seconds.
    syncStaleSeconds: 1800

extraEnv: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
