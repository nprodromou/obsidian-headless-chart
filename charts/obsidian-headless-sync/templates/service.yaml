{{- $exposeUi := include "ohs.uiExposed" . }}
{{- if or .Values.metrics.service.enabled $exposeUi }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ohs.fullname" . }}
  labels:
    {{- include "ohs.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "ohs.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.metrics.service.enabled }}
    - name: metrics
      port: {{ .Values.keeper.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- /* The status page is in the Service only when ui.listenAddress opts in. */}}
    {{- if $exposeUi }}
    - name: ui
      port: {{ .Values.ui.port }}
      targetPort: ui
      protocol: TCP
    {{- end }}
{{- end }}
