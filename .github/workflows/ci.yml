name: ci

# Pull requests → app tests, chart checks, and an image build + smoke run per
#                 architecture. Nothing is pushed; the token is read-only.
# Push to main  → the same, then a multi-arch image push tagged main and
#                 sha-<short>. Releases (image + chart) come from release.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/nprodromou/obsidian-headless-sync

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (real git repos)
        working-directory: image/app
        run: npm test
      - name: Shellcheck
        run: shellcheck image/app/bin/*.sh scripts/*.sh

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint, render, validate, contract-test
        run: ./scripts/test-chart.sh

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ohs:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # Runs the image the way the chart does: unprivileged, read-only root,
      # writable /tmp and /data only. Installs the pinned client from npm, then
      # checks it starts and that its native SQLite binding loads. Then starts
      # the keeper in wizard mode and fetches the status page and the setup
      # code form from its loopback listener, with a foreign Host header
      # refused and the setup code in the keeper's log.
      - name: Smoke run
        run: |
          echo '{"dataDir":"/data","authMode":"file","vaults":[]}' > "$RUNNER_TEMP/config.json"
          docker run --rm --platform ${{ matrix.platform }} \
            --user 1000:1000 --read-only \
            --tmpfs /tmp:uid=1000,gid=1000 --tmpfs /data:uid=1000,gid=1000,exec \
            -v "$RUNNER_TEMP/config.json:/etc/obsidian-headless/config.json:ro" \
            ohs:smoke sh -c '
              set -e
              node /app/bin/prepare.mjs --install-only
              node /app/bin/prepare.mjs --install-only | grep -q "already installed"
              node /app/bin/smoke.mjs
              node /app/bin/keeper.mjs --version
              node /app/bin/keeper.mjs > /tmp/keeper.log 2>&1 &
              node --input-type=module -e "
                import http from \"node:http\";
                // fetch() drops a Host header; http.get sends it as given.
                const once = (host, path) => new Promise((resolve, reject) => {
                  http.get({ host: \"127.0.0.1\", port: 8080, path, setHost: false, headers: { Host: host } }, (res) => {
                    let body = \"\";
                    res.on(\"data\", (c) => { body += c; });
                    res.on(\"end\", () => resolve({ status: res.statusCode, body }));
                  }).on(\"error\", reject);
                });
                const get = async (host, path = \"/\") => {
                  for (let i = 0; i < 50; i++) {
                    try { return await once(host, path); } catch { await new Promise((r) => setTimeout(r, 200)); }
                  }
                  throw new Error(\"status page never came up\");
                };
                const ok = await get(\"localhost:8080\");
                if (ok.status !== 200 || !ok.body.includes(\"no git-backed vaults\")) throw new Error(\"status page: \" + ok.status);
                const bad = await get(\"attacker.example\");
                if (bad.status !== 421) throw new Error(\"foreign Host got \" + bad.status);
                const setup = await get(\"localhost:8080\", \"/setup\");
                if (setup.status !== 200 || !setup.body.includes(\"name=\\\"code\\\"\")) throw new Error(\"setup page: \" + setup.status);
                console.log(\"status page and setup form ok\");
              " || { cat /tmp/keeper.log; exit 1; }
              grep -Eq "setup code: [0-9a-f]{32} " /tmp/keeper.log || { cat /tmp/keeper.log; exit 1; }
              git --version && git lfs version && ssh -V
            '

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push main + sha tags
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=sha-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
